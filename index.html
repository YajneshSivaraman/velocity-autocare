<!doctype html>
<html lang="en">
  <head>
    <!-- Set the document character encoding. -->
    <meta charset="UTF-8" />

    <!-- Ensure the website scales correctly on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Set the browser tab title. -->
    <title>VELOCITY AUTOCARE | Premium Automotive Detailing</title>

    <!-- Add a short description for search engines. -->
    <meta
      name="description"
      content="Discover precision automotive detailing, ceramic coating, paint correction, paint protection film, and interior detailing at VELOCITY AUTOCARE."
    />

    <!-- Set the browser theme color to match the titanium design. -->
    <meta name="theme-color" content="#F5F7FA" />

    <!-- Use the project's favicon if the file exists in the public folder. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <!-- React mounts the complete website inside this element. -->
    <div id="root"></div>

    <!-- Load the React application through Vite. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
